openapi: 3.1.0
info:
  title: Title
  description: Title
  version: 1.0.0
servers:
  - url: 'https://localhost:8080'
paths:
  /api/categories:
    post:
      tags:
        - Category-controller
      operationId: createCourse
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryDto'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryDto'
components:
  schemas:
    CategoryDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        categoryname:
          type: string
        products:
          $ref: '#/components/schemas/ProductDto'
    ProductDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        productname:
          type: string
        price:
          type: integer
