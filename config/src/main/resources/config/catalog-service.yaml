server:
  port: 8087
eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8085/eureka/
spring:
  flyway:
    baseline-on-migrate=true:
  servlet:
    multipart:
      max-file-size: 10MB
#  datasource:
#    url=jdbc:postgresql://localhost:5432/koszegi
#    username:postgres
#    password:postgres
  cache:
    infinispan:
      config=classpath:infinispan:
        xml:eureka:

  jpa:
    database: POSTGRESQL
    show-sql: true
    open-in-view: false
    hibernate:
      ddl-auto: none
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      connection-timeout: 30000
      max-lifetime: 1800000
